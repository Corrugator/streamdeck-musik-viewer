<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0A0C0F"/>
    </linearGradient>
    <linearGradient id="metalRedC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4D52"/>
      <stop offset="100%" stop-color="#7A0816"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bgC)"/>
  <!-- Logo on the left, prominent -->
  <g transform="translate(36, 30) scale(0.27)">
    <polygon points="256,90 410,178 410,334 256,422 102,334 102,178"
             fill="none" stroke="url(#metalRedC)" stroke-width="22" stroke-linejoin="round"/>
    <g fill="url(#metalRedC)">
      <rect x="170" y="240" width="28" height="80"  rx="8"/>
      <rect x="212" y="180" width="28" height="140" rx="8"/>
      <rect x="254" y="210" width="28" height="110" rx="8"/>
      <rect x="296" y="170" width="28" height="150" rx="8"/>
      <rect x="338" y="225" width="28" height="95"  rx="8"/>
    </g>
  </g>
  <!-- Text on the right -->
  <text x="170" y="92" font-family="-apple-system, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">Apple Music</text>
  <text x="170" y="128" font-family="-apple-system, sans-serif" font-size="24" font-weight="400" fill="#9CA3AF">Nothing playing</text>
</svg>
