<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0A0C0F"/>
    </linearGradient>
    <linearGradient id="metalRedB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4D52"/>
      <stop offset="100%" stop-color="#7A0816"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#bgB)"/>
  <!-- Just a clean, minimal display - text only, no logo -->
  <text x="200" y="95" text-anchor="middle"
        font-family="-apple-system, sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Nothing playing</text>
  <text x="200" y="135" text-anchor="middle"
        font-family="-apple-system, sans-serif" font-size="26" font-weight="400" fill="#9CA3AF">Open Apple Music to start</text>
  <!-- Subtle accent bar -->
  <rect x="160" y="160" width="80" height="3" rx="1.5" fill="url(#metalRedB)"/>
</svg>
